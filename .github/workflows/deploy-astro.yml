# === Workflow GitHub Pages pour le site Astro ===
# À coller dans .github/workflows/deploy.yml (Edit sur GitHub), puis :
# Settings → Pages → Source : GitHub Actions
name: Déployer le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Générer la structure + les index (recherche + liste des cas)
        run: |
          python3 scripts/refresh_structure.py
          python3 scripts/gen_astro_indexes.py
      - name: Build Astro
        run: npx astro build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
